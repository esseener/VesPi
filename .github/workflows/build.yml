name: Build

# Nothing builds on a normal push. A version tag (e.g. v1.0.41) is the deliberate
# "cut a release" step: it builds the Windows installer and attaches it — plus the
# checksum manifest the in-app updater refuses to install without — to a GitHub
# release. A manual run (Actions tab / `gh workflow run build.yml`) builds the
# same artefacts and uploads them as artifacts, touching no release: that is how
# to rehearse the pipeline before tagging.
#
# Windows only, deliberately. VesPi ships one platform, and it bundles the private
# OMP kernel for it (`extraResources` pins `runtime/omp/omp.exe`); a macOS or Linux
# job would need a per-platform kernel fetch first. Add them here once that exists.
#
# Release notes are NOT generated here. Create the release (draft/tag with notes)
# before pushing the tag — the publish step keeps an existing body and only
# attaches files. A tag pushed without a release gets one with an empty body.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint & test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Fetch bundled kernel
        # Not in git (200 MB+), and three engine-resolution tests assert that the
        # private binary resolves — the same precondition a developer's machine
        # satisfies from earlier builds. ci.yml fetches it before its own checks
        # for the same reason. Runs here, before the tests.
        run: npm run prepare:runtime:release

      - name: Unit tests
        # Enumerate the files instead of passing a `**` glob: tsx forwards file
        # arguments to Node, and glob expansion there needs a newer runtime than
        # the runner is guaranteed to have. `resources/` holds the shared
        # permission-rules engine's tests, so include it too.
        shell: bash
        run: npx --no-install tsx --test --test-concurrency=1 $(find src resources -name '*.test.ts')

      - name: Kernel gate
        # The kernel is half the product and the lock pins which build ships.
        # Exit 1 = the lock is behind the newest release, exit 2 = unknowable
        # (offline, API error) — both must stop the build rather than ship a
        # package whose kernel is already stale.
        #
        # Pass a token: anonymous GitHub API calls share a 60/hour per-IP pool,
        # which shared runners exhaust, producing a 403 that reads exactly like
        # a stale kernel. Authenticated calls get 5000/hour.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run kernel:check

  build:
    name: Build installer
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled kernel
        # Not in git (200 MB+). Downloads the binary the lock pins and verifies
        # its SHA-256 against the manifest.
        run: npm run prepare:runtime:release

      - name: Check release consistency
        # App version, lock, version marker and the actual binary bytes have to
        # agree. Runs after the fetch, because it hashes the binary.
        run: npm run check:release

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package (NSIS)
        run: npx --no-install electron-builder --win nsis --publish never

      - name: Write checksum manifest
        run: npm run checksums:release

      - name: Assert the names the updater looks for
        # Two contracts the in-app updater depends on: the exact asset name
        # (`vespiInstallerAssetName`) and a SHA256SUMS.txt beside it. Breaking
        # either one silently strands every installed client on its old version,
        # so fail here instead of shipping it.
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          test -f "release/VesPi-Setup-${ver}-win-x64.exe" \
            || { echo "::error::expected release/VesPi-Setup-${ver}-win-x64.exe"; ls -l release; exit 1; }
          test -f release/SHA256SUMS.txt \
            || { echo "::error::missing release/SHA256SUMS.txt — the updater refuses to install without it"; exit 1; }
          echo "ok: VesPi-Setup-${ver}-win-x64.exe + SHA256SUMS.txt"

      - name: Assert the shipped bundle carries the current changes
        # "I changed it but the installed app still looks the same" happened more
        # than once, always for the same reason: a stale `out/`, or a change that
        # never made it into the package. These markers exist only in the current
        # build, so the release fails here rather than shipping a bundle that is
        # quietly older than the tag says.
        shell: bash
        run: |
          asar=release/win-unpacked/resources/app.asar
          test -f "$asar" || { echo "::error::$asar is missing"; exit 1; }
          assert_marker() {
            # `-e` matters: a marker that begins with `--` (a CSS custom property)
            # would otherwise be read as a grep option and reported as missing.
            if ! grep -q -e "$2" "$asar"; then
              echo "::error::bundle is missing the marker for: $1 ($2)"
              exit 1
            fi
            echo "ok: $1"
          }
          # Multi-part downloader (1.0.42): its fallback marker is a code constant.
          assert_marker "multi-part downloader" "RANGE_UNSUPPORTED"
          # Sidebar runtime indicator (1.0.43): the working spinner's class combo.
          assert_marker "sidebar working indicator" "animate-spin text-accent-fg"
          # Sidebar idle ring (1.0.43): its accessibility label.
          assert_marker "sidebar idle ring" "is running"
          # Composer light + floating surfaces (1.0.46): the conic sweep that
          # replaced the seamy linear one, and the shared panel treatment.
          assert_marker "composer flow light" "--vespi-flow-angle"
          assert_marker "floating surface treatment" "surface-floating"
          # Scroll follow (1.0.44): the decision module and the rate-limit backoff.
          assert_marker "scroll follow decision" "shouldFollowContent"
          assert_marker "update check backoff" "updateCheckBackoffUntil"
          # Provider editor (1.0.45): the row round-trip and the retired-provider filter.
          assert_marker "provider row round-trip" "rowsToConfig"
          assert_marker "retired provider filter" "isProviderRetired"
          # Keyless-provider guard (1.0.47). OMP rejects the whole models.yml when
          # a custom provider declares models without a key, so this guard is what
          # keeps one emptied provider from blanking the entire model list. It
          # ships in the main bundle, and the name is a top-level function there,
          # so the marker survives bundling.
          assert_marker "keyless provider guard" "providerIsLoadable"
          assert_marker "keyless provider guard honours auth" "auth === \"none\""
          # Composer auto-hide (1.0.47): scroll away from the bottom and the
          # transparent composer stops covering the transcript; scroll back and
          # it returns. Both the decision and the flag that feeds it must ship.
          assert_marker "composer hide decision" "shouldHideComposer"
          assert_marker "composer user-work flag" "composerHasUserWork"
          # Goal strip fixes (1.0.49): terminal-goal cleanup and click feedback.
          assert_marker "goal terminal cleanup" "normalizeGoalState"
          assert_marker "goal pending feedback" "goalPending"
          # Goal strip control (1.0.50): a click dispatches the kernel's goal
          # extension command instead of posting a chat message, and the
          # extension steers a hidden instruction at the model. The channel name
          # and the renderer action live in app.asar; the extension itself is an
          # extraResource, so it is checked as a file rather than through grep.
          assert_marker "goal control channel" "pi:goal-control"
          assert_marker "goal control dispatched" "goalControl"
          goal_ext=release/win-unpacked/resources/resources/vespi-goal.ts
          if [ ! -f "$goal_ext" ]; then
            echo "::error::$goal_ext is missing from the package"
            exit 1
          fi
          for marker in "VESPI-GOAL-CONTROL" "GOAL_CONTROL_COMMAND = 'vespi-goal'"; do
            if ! grep -q -e "$marker" "$goal_ext"; then
              echo "::error::the shipped goal extension is missing: $marker"
              exit 1
            fi
            echo "ok: goal extension carries $marker"
          done
          # Live thinking (1.0.51): a streaming turn's reasoning block starts
          # collapsed, so its text no longer buries the answer in progress.
          assert_marker "live thinking starts collapsed" "liveThinkingStartsExpanded"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach installers to the release
        # `prerelease` must stay false: the in-app update check ignores
        # prereleases, so publishing one would make the new version invisible to
        # every installed client.
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/**/*
