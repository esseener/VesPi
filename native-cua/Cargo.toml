[package]
name = "vespi-cua"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "VesPi computer-use sidecar: windows, accessibility, screenshots and input injection for the OMP agent shell."

# A separate process rather than a Node addon on purpose. VesPi ships this inside
# the installer and Electron's ABI would otherwise tie it to one Node build; a
# sidecar has no ABI to match and can be replaced independently of the shell.
[[bin]]
name = "vespi-cua"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
